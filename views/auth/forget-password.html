<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Student Loan Application System</title>
    <link rel="icon" type="image/png" href="../../assets/images/i.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css">
    <link href="../../assets/css/auth/login.css?v=20261022-large-header-logo3" rel="stylesheet">
</head>
<body class="login-page">
    <div class="container-fluid p-0 vh-100 auth-login-shell">
        <div class="row g-0 h-100 auth-login-row">
            <div class="col-md-7 bg-light d-flex flex-column justify-content-center align-items-center p-5 position-relative auth-brand-panel">
                <div class="text-center mb-3 brand-stack" style="margin-top:-12px;">
                    <div class="mb-0">
                        <img src="../../assets/images/csdl-logo.png" alt="CSDL Logo" style="width: 600px; height: 300px; object-fit: contain;">
                    </div>
                    <p class="text-muted">PHINMA Cagayan de Oro College</p>
                </div>
                <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="z-index: 0;">
                    <div class="position-absolute" style="width: 200px; height: 300px; background-color: rgba(3, 96, 15, 0.10); top: 10%; left: 5%; transform: skew(-15deg);"></div>
                    <div class="position-absolute" style="width: 150px; height: 200px; background-color: rgba(3, 96, 15, 0.15); top: 15%; left: 25%; transform: skew(-15deg);"></div>
                    <div class="position-absolute" style="width: 250px; height: 350px; background-color: rgba(3, 96, 15, 0.20); bottom: 10%; right: 15%; transform: skew(-15deg);"></div>
                </div>
            </div>
            <div class="col-md-5 bg-white d-flex align-items-center justify-content-center auth-form-panel">
                <div class="login-form-container p-4">
                    <div class="auth-education-brand mb-4 d-flex align-items-center justify-content-center gap-3">
                        <div class="auth-seal-slot">
                            <button class="auth-privacy-seal" type="button" data-bs-toggle="modal" data-bs-target="#privacySealModal" aria-label="View DPO/DPS registration seal" aria-haspopup="dialog" aria-controls="privacySealModal">
                                <img src="../../assets/images/dpo-dps-registration-seal.png" alt="National Privacy Commission DPO/DPS registered seal, valid until 23 September 2027" width="508" height="780">
                            </button>
                        </div>
                        <div class="auth-education-identity">
                            <img class="auth-education-logo" src="../../assets/images/logo.png" alt="PHINMA Education">
                            <div class="text-start auth-education-copy">
                                <div class="fw-semibold auth-education-name">PHINMA EDUCATION</div>
                                <div class="text-muted auth-education-tagline">MAKING LIVES BETTER THROUGH EDUCATION</div>
                            </div>
                        </div>
                    </div>

                    <h5 class="mb-4 border-bottom pb-2">Forgot Password</h5>

                    <div id="fpStepRequest" class="">
                        <form id="fpRequestForm" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="fp_school_id" class="form-label small fw-bold">School ID</label>
                                <input type="text" class="form-control" id="fp_school_id" placeholder="Enter School ID" required>
                                <div class="invalid-feedback">Please enter a valid School ID.</div>
                            </div>
                            <div class="mb-3">
                                <div id="forgotPasswordTurnstile" data-sitekey="0x4AAAAAAEfJmTeYu_FnS4Lj" aria-label="Security verification"></div>
                            </div>
                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" id="fpSubmitBtn" class="btn btn-success border-0" style="background: linear-gradient(135deg, #03600f 0%, #0a8f1b 100%);">
                                    <span id="fpSubmitBtnText">Submit</span>
                                    <span id="fpSubmitBtnSpinner" class="d-none">
                                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                        Sending OTP...
                                    </span>
                                </button>
                                <a href="login.html" class="btn btn-outline-secondary">Back to Sign In</a>
                            </div>
                        </form>
                    </div>

                    <div id="fpStepVerify" class="d-none">
                        <form id="fpVerifyForm" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="fp_otp" class="form-label small fw-bold">Enter OTP</label>
                                <input type="text" class="form-control" id="fp_otp" placeholder="6-digit code" maxlength="6" required>
                                <div class="invalid-feedback">Please enter the OTP sent to your email.</div>
                            </div>
                            <div class="mb-3">
                                <label for="fp_new_password" class="form-label small fw-bold">New Password</label>
                                <div class="input-group has-validation">
                                    <input type="password" class="form-control" id="fp_new_password" placeholder="Enter new password" autocomplete="new-password" required>
                                    <button type="button" class="btn btn-outline-secondary" data-password-toggle="fp_new_password" aria-controls="fp_new_password" aria-label="Show new password" aria-pressed="false"><i class="bi bi-eye-slash" aria-hidden="true"></i></button>
                                    <div class="invalid-feedback">Please enter a strong password.</div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="fp_confirm_password" class="form-label small fw-bold">Confirm Password</label>
                                <div class="input-group has-validation">
                                    <input type="password" class="form-control" id="fp_confirm_password" placeholder="Confirm new password" autocomplete="new-password" required>
                                    <button type="button" class="btn btn-outline-secondary" data-password-toggle="fp_confirm_password" aria-controls="fp_confirm_password" aria-label="Show confirm password" aria-pressed="false"><i class="bi bi-eye-slash" aria-hidden="true"></i></button>
                                    <div class="invalid-feedback">Passwords must match.</div>
                                </div>
                            </div>
                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" class="btn btn-success border-0" style="background: linear-gradient(135deg, #03600f 0%, #0a8f1b 100%);">
                                    Reset Password
                                </button>
                                <button type="button" id="fpBackBtn" class="btn btn-outline-secondary">Back</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade auth-seal-modal" id="privacySealModal" tabindex="-1" aria-labelledby="privacySealTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <h2 class="visually-hidden" id="privacySealTitle">DPO / DPS registration seal</h2>
                <button class="auth-seal-close" type="button" data-bs-dismiss="modal" aria-label="Close registration seal">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
                <div class="modal-body">
                    <img class="auth-seal-preview" src="../../assets/images/dpo-dps-registration-seal.png" alt="National Privacy Commission DPO/DPS registered seal, valid until 23 September 2027" width="508" height="780">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
    <meta name="csrf-token" content="">
    <script type="module" src="../../js/auth/auth-forget-password.js?v=20260929-password-toggle"></script>
</body>
</html>
